<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            background: #000;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: auto;
            min-width: 100%;
            min-height: 100vh;
        }

        .container {
            width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .rectangle {
            width: 850px;
            height: calc(850px * 16 / 11);
            background-image: url("monika.webp");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;

            flex-shrink: 0;
        }

        .text {
            width: 850px;
            margin: 0;
            color: #888888;
            font-family: sans-serif;
            font-size: 14px;
            line-height: 1.4;
            text-align: center;
            flex-shrink: 0;
        }

        a {
            color: #69919d;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="rectangle"></div>
        <p class="text">
            Poem taken from the physical edition of <a href="https://ddlc.plus/#buy-now">Doki Doki Literature Club Plus!</a><br>&copy;2021 Team Salvato &amp; Serenity Forge
        </p>

    </div>

</body>
</html>
