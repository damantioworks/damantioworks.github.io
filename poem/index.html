<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monika</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .rectangle {

            background-image: url('monika.webp');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            box-sizing: border-box;
            width: min(85vw, calc(85vh * 11 / 16));
            aspect-ratio: 11 / 16;
        }

        .text {
            color: #888888;
            font-size: 0.85rem;
            font-family: sans-serif;
            margin: 0;
            text-align: center;
        }

        a {
            color: #69919d;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="rectangle"></div>
        <p class="text">Poem taken from the physical edition of <a href="https://ddlc.plus/#buy-now">Doki Doki Literature Club Plus!</a><br> &copy;2021 Team Salvato & Serenity Forge</p>
    </div>

</body>

</html>
